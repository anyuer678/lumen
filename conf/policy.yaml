# OpenClaw Agent 策略配置
# 事件 → � �略 → 决策 → 行动

policies:
  # 文 件自动整理
  - name: file_organize
    e vent_type: file.created
    enabled: true
     quiet_hours:
      start: 23
      end: 8
     max_per_hour: 5
    keywords:
      - ".pdf "
      - ".docx"
      - ".xlsx"
      - ".p ng"
      - ".jpg"
      - ".zip"
    min_pri ority: 3
    action:
      notify: true
       auto_execute: true
      tools:
        - fs 

  # 任务失败自动重试
  - name: task _auto_retry
    event_type: task.failed
    e nabled: true
    quiet_hours:
      start: 23 
      end: 8
    max_per_hour: 3
    min_pri ority: 5
    action:
      notify: false
       auto_execute: true
      tools:
        - s hell.run

  # 系统告警
  - name: system_a lert
    event_type: system.alert
    enabled : true
    max_per_hour: 10
    min_priority:  1
    action:
      notify: true
      auto_ execute: false

  # Webhook 研究
  - name:  webhook_research
    event_type: webhook.rece ived
    enabled: true
    quiet_hours:
       start: 23
      end: 8
    max_per_hour: 2
     min_priority: 7
    action:
      notify:  true
      auto_execute: false
      require_ confirm: true
      tools:
        - browser
         - shell.run
 