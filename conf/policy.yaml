# 事件 → 策略 → 决策 → 行动
#
# Security defaults (Sprint3):
# computer-use and mcp.register are DISABLED by default (code + config).
# Explicit opt-in lives in conf/config.yaml:
#   permissions.computer_use_enabled: true
#   mcp.enabled: true
# Event policies below must not silently re-enable those surfaces.

features:
  computer_use: false
  mcp_register: false

policies:
  # 文件自动整理
  - name: file_organize
    event_type: file.created
    enabled: true
    quiet_hours:
      start: 23
      end: 8
    max_per_hour: 5
    keywords:
      - ".pdf"
      - ".docx"
      - ".xlsx"
      - ".png"
      - ".jpg"
      - ".zip"
    min_priority: 3
    action:
      notify: true
      # 文件整理涉及移动用户文件，与 task.failed 同口径：需要人工确认后执行
      auto_execute: false
      require_confirm: true
      tools:
        - fs

  # 任务失败自动重试
  # 安全：默认不自动执行 shell；仅通知。如需 shell 重试，必须显式改为
  # auto_execute: true + require_confirm: true，并确保 shell_profile 允许。
  - name: task_auto_retry
    event_type: task.failed
    enabled: true
    quiet_hours:
      start: 23
      end: 8
    max_per_hour: 3
    min_priority: 5
    action:
      notify: true
      auto_execute: false
      require_confirm: true
      tools: []

  # 系统告警
  - name: system_alert
    event_type: system.alert
    enabled: true
    max_per_hour: 10
    min_priority: 1
    action:
      notify: true
      auto_execute: false

  # Webhook 研究
  # 安全：默认不自动执行 shell；浏览器类工具也需确认。
  - name: webhook_research
    event_type: webhook.received
    enabled: true
    quiet_hours:
      start: 23
      end: 8
    max_per_hour: 2
    min_priority: 7
    action:
      notify: true
      auto_execute: false
      require_confirm: true
      tools:
        - browser